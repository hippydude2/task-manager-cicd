
name: GitHub Projects Automation

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to mark completed"
        required: true
        default: "1"

permissions:
  contents: read
  issues: write

jobs:
  move-issue-to-done:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Move Issue to Done
      - name: Move Issue to Done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MANUAL_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [ -n "$MANUAL_ISSUE" ]; then
            ISSUE_NUMBERS="$MANUAL_ISSUE"
          else
            ISSUE_NUMBERS=$(printf '%s\n' "$PR_BODY" |
              grep -Eio '(closes|fixes|resolves)[[:space:]]+#[0-9]+' |
              grep -Eo '[0-9]+' | sort -u) || true
          fi

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found."
            exit 0
          fi

          for ISSUE_NUMBER in $ISSUE_NUMBERS; do
            curl --fail-with-body -L -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPOSITORY/issues/$ISSUE_NUMBER" \
              -d '{"state":"closed","state_reason":"completed"}'

            echo "Issue #$ISSUE_NUMBER marked as completed."
          done
